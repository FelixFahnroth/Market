name: ais-chat-local

services:
  # Keycloak for authentication
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      CLIENT_NAME: ais-chat-dev-client
      CLIENT_SECRET: ClientSecret
      KC_HOSTNAME: https://market-vvy6mg-3c9729-49-12-232-194.sslip.io
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    entrypoint: /opt/keycloak/data/import/entrypoint.sh
    volumes:
      - keycloak_data:/opt/keycloak/data/h2
      - ./keycloak:/opt/keycloak/data/import
    ports:
      - '8180:8080'
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.market-auth.rule=Host(`market-vvy6mg-3c9729-49-12-232-194.sslip.io`)"
      - "traefik.http.routers.market-auth.entrypoints=web,websecure"
      - "traefik.http.routers.market-auth.tls=true"
      - "traefik.http.services.market-auth.loadbalancer.server.port=8080"

  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro

  # Valkey (Redis-compatible) for session storage
  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.1-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    ports:
      - '6379:6379'

  # RabbitMQ for async messaging and reporting
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - '5672:5672'
      - '15672:15672'

  # Crawl4AI for web scraping capabilities
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    platform: linux/amd64
    environment:
      CRAWL4AI_API_TOKEN: ais-chat-crawl4ai-token
    restart: unless-stopped
    ports:
      - '11235:11235'
    deploy:
      resources:
        limits:
          memory: '2gb'
        reservations:
          memory: '1gb'
    shm_size: '2gb'

  # Xberg text extraction service
  xberg:
    image: ghcr.io/xberg-io/xberg:1.0.14-core
    restart: unless-stopped
    environment:
      XBERG_MAX_UPLOAD_SIZE_MB: '50'
    volumes:
      - xberg_cache:/app/.xberg

  # RustFS - S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin123
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
    ports:
      - '9001:9001'

  bifrost:
    image: ghcr.io/maximhq/bifrost:v1.6.8
    restart: unless-stopped
    environment:
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_ADMIN_PASSWORD: admin
      BIFROST_API_KEY: sk-bf-example-key
    volumes:
      - ./bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data
    ports:
      - '8089:8080'

  # AIS.chat API - OpenAI compatible API service
  ais-chat-api:
    image: ghcr.io/fwu-de/ais-chat-api:latest
    restart: unless-stopped
    ports:
      - '3102:3002'
    environment:
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db
      API_NAME: ais-chat
      API_KEY: ais-chat-api_api-key
      PORT: 3002
      LOG_LEVEL: info
      LLM_IONOS_API_KEY: API_KEY_PLACEHOLDER
      LLM_IONOS_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT4OMINI_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT4OMINI_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT5NANO_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT5NANO_BASE_URL: PLACEHOLDER_BASE_URL
      BIFROST_BASE_URL: http://bifrost:8080/openai/v1
      BIFROST_API_KEY: sk-bf-example-key
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
      bifrost:
        condition: service_started

  # AIS.chat App - Main user-facing application
  ais-chat-app:
    image: ghcr.io/fwu-de/ais-chat-app:latest
    restart: unless-stopped
    ports:
      - '3100:3000'
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_KEY: ais-chat-app_api-key
      NODE_ENV: production
      AUTH_SECRET: ais-chat-default-secret-please-change-in-production-use-openssl-rand-base64-32
      VIDIS_CLIENT_ID: ais-chat-dev-client
      VIDIS_CLIENT_SECRET: ClientSecret
      VIDIS_BASE_URI: https://market-vvy6mg-3c9729-49-12-232-194.sslip.io/realms/ais-chat-local
      VIDIS_ISSUER_URI: https://market-vvy6mg-3c9729-49-12-232-194.sslip.io/realms/ais-chat-local
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/app_db
      API_DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db
      DB_CACHE_TTL_SECONDS: 300
      VALKEY_URL: redis://valkey:6379/0
      RABBITMQ_URI: amqp://user:password@rabbitmq:5672
      API_URL: http://ais-chat-api:3002
      CRAWL4AI_URL: http://crawl4ai:11235
      CRAWL4AI_API_TOKEN: ais-chat-crawl4ai-token
      XBERG_URL: http://xberg:8000
      BIFROST_BASE_URL: http://bifrost:8080/openai/v1
      BIFROST_API_KEY: sk-bf-example-key
      OTC_SECRET_ACCESS_KEY: rustfsadmin123
      OTC_ACCESS_KEY_ID: rustfsadmin
      OTC_S3_HOSTNAME: http://rustfs:9000
      OTC_BUCKET_NAME: ais-chat
      ENCRYPTION_KEY: default-encryption-key-change-in-production
      GOOGLE_APPLICATION_CREDENTIALS: ''
      NEXT_PUBLIC_SENTRY_LOG_LEVEL: debug
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.market-chat.rule=Host(`market-vvy6mg-2ca57a-49-12-232-194.sslip.io`)"
      - "traefik.http.routers.market-chat.entrypoints=web,websecure"
      - "traefik.http.routers.market-chat.tls=true"
      - "traefik.http.services.market-chat.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_started
      rabbitmq:
        condition: service_started
      crawl4ai:
        condition: service_started
      xberg:
        condition: service_started
      rustfs:
        condition: service_started
      keycloak:
        condition: service_started
      bifrost:
        condition: service_started

  # AIS.chat Admin - Administration interface
  ais-chat-admin:
    image: ghcr.io/fwu-de/ais-chat-admin:latest
    restart: unless-stopped
    ports:
      - '3101:3001'
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3001
      AUTH_SECRET: ais-chat-default-secret-please-change-in-production-use-openssl-rand-base64-32
      KEYCLOAK_CLIENT_ID: ais-chat-dev-client
      KEYCLOAK_CLIENT_SECRET: ClientSecret
      KEYCLOAK_ISSUER: https://market-vvy6mg-3c9729-49-12-232-194.sslip.io/realms/ais-chat-local
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/app_db
      ENCRYPTION_KEY: default-encryption-key-change-in-production
      API_DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db
      API_KEY: ais-chat-api_api-key
      API_URL: http://ais-chat-api:3002
      BIFROST_ADMIN_URL: http://bifrost:8080
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_ADMIN_PASSWORD: admin
      NEXT_PUBLIC_SENTRY_LOG_LEVEL: info
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.market-admin.rule=Host(`market-vvy6mg-a7fe0d-49-12-232-194.sslip.io`)"
      - "traefik.http.routers.market-admin.entrypoints=web,websecure"
      - "traefik.http.routers.market-admin.tls=true"
      - "traefik.http.services.market-admin.loadbalancer.server.port=3001"
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
      bifrost:
        condition: service_started

  # Initialization container
  ais-chat-init:
    image: alpine:3.24.1
    restart: no
    environment:
      DATABASE_URL: postgresql://admin:test1234@postgres:5432/app_db
      API_DATABASE_URL: postgresql://admin:test1234@postgres:5432/api_db
      LLM_IONOS_API_KEY: API_KEY_PLACEHOLDER
      LLM_IONOS_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT4OMINI_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT4OMINI_BASE_URL: PLACEHOLDER_BASE_URL
      LLM_GPT5NANO_API_KEY: API_KEY_PLACEHOLDER
      LLM_GPT5NANO_BASE_URL: PLACEHOLDER_BASE_URL
    command: >
      sh -c "
        echo '=== Starting AIS.chat Initialization ==='
        apk add --no-cache s3cmd postgresql-client
        s3cmd --access_key=rustfsadmin --secret_key=rustfsadmin123 --host=rustfs:9000 --host-bucket='rustfs:9000/%(bucket)' --region=us-east-1 --no-ssl --no-check-certificate mb s3://ais-chat || true
        PGPASSWORD=test1234 psql -h postgres -U admin -d api_db -c \"INSERT INTO organization (name) SELECT 'LOCAL' WHERE NOT EXISTS (SELECT 1 FROM organization);\" || true
        echo '=== AIS.chat initialization completed successfully ==='
      "
    depends_on:
      postgres:
        condition: service_started
      rustfs:
        condition: service_started
      keycloak:
        condition: service_started
      ais-chat-api:
        condition: service_started
      ais-chat-app:
        condition: service_started

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  valkey_data:
  keycloak_data:
  bifrost_data:
  rustfs_data:
  xberg_cache:
